[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qca-sim"
version = "1.7.0"
authors = [{name = "11-qlab"}]
keywords = ["quantum computing", "QCA", "toric code", "surface code", "STA clocking", "fault tolerance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
readme = "README.md"
description = "Quantum-dot Cellular Automata simulator: Hubbard cell exact diagonalization, native quantum gates, STA clocking"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]
license = "Apache-2.0"
